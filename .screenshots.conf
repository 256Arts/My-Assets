# Read by the shared `screenshots` runner in Repos/Scripts. Everything not set here takes that
# script's defaults — device names, canvas size, and the wallpaper backdrop.

PROJECT="My Assets.xcodeproj"
SCHEME="Screenshots"
APP_BUNDLE_ID="com.jaydenirwin.myassets"
MAC_APP_NAME="My Assets"
PLATFORMS="iphone ipad mac vision watch"
IPAD_ORIENTATION="portrait"

# What each shot shows, for the "Screenshots.md" the run writes beside them. Keyed by the UI test's
# capture name without its "NN-" prefix.
SHOT_DESCRIPTIONS="
  summary      = The Summary over the seeded account: balance and net worth with their charts, the
                 cash flows, and the insights
  assets-debts = The Assets/Debts tab, every seeded account and what it is worth
  income       = The Income tab, the seeded income sources and their amounts
  expenses     = The Expenses tab, the seeded recurring expenses
  credit-cards = The Credit Cards tab, the seeded cards and their balances
"

# The app's folder on the 256 Arts site. `--upload` refreshes the shots its page shows from
# the ones here, resized to the frame that page draws.
WEBSITE_SLUG="myassets"
